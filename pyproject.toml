[project]
name = "mini-fde-tooling"
version = "0.1.0"
description = "Local tooling baseline for mini-fde"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.11",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_fde"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: isolated deterministic tests",
  "contract: schema and boundary tests",
  "local_integration: local adapter integration tests",
  "managed_dev: tests that require managed development services",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/**/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unused_configs = true
